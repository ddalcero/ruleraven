{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ruleraven.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ruleraven.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ruleraven.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.http.port }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        {{- toYaml .Values.networkPolicy.egressPorts | nindent 8 }}
{{- end }}
