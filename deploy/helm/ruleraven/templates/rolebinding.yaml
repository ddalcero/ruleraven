{{- if and .Values.rbac.create (not .Values.rbac.clusterWide) }}
{{- range $index, $namespace := .Values.cluster.watchNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ruleraven.fullname" $ }}-watcher
  namespace: {{ $namespace }}
  labels:
    {{- include "ruleraven.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ruleraven.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ruleraven.fullname" $ }}-watcher
{{- end }}
{{- end }}
