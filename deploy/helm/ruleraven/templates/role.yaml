{{- if and .Values.rbac.create (not .Values.rbac.clusterWide) }}
{{- range $index, $namespace := .Values.cluster.watchNamespaces }}
{{- if $index }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ruleraven.fullname" $ }}-watcher
  namespace: {{ $namespace }}
  labels:
    {{- include "ruleraven.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
